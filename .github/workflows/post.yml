name: Post @TheWineryBooks

on:
  schedule:
    # Monday, Wednesday and Friday at 12:00 PM America/Los_Angeles. The slot is scheduled in both PDT
    # (19:00 UTC) and PST (20:00 UTC) and once more as a retry; the script itself posts only from
    # noon in Pacific time, so daylight saving needs no edit. GitHub runs these late or not at all on
    # a quiet repo, which launchd/ can back up. Only dates listed in posts/schedule.json ever post,
    # and the markers in published/ stop later runs from posting again.
    - cron: '7 19 * * 1,3,5'
    - cron: '7 20 * * 1,3,5'
    - cron: '7 21 * * 1,3,5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Post a date listed in posts/schedule.json (YYYY-MM-DD) now, skipping the time-of-day check'
        required: false
      dry_run:
        description: 'Only log what would be posted'
        type: boolean
        default: false
      by_hand:
        description: 'I posted this date by hand: only record it (needs date), so the job never posts it'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    concurrency:
      group: post-winerybooks
      cancel-in-progress: false
    steps:
      # ref: the branch as it is when this step runs, not the commit the run was queued with. Runs queue
      # behind each other (concurrency above), so a run created while another was posting would
      # otherwise check out main from before that post's marker and post the same date again.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # One account per repository: IG_ACCESS_TOKEN and IG_USER_ID are @TheWineryBooks's. If they are
      # missing the job skips with a notice instead of failing.
      - name: Check the account's credentials
        id: creds
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$IG_USER_ID" ]; then
            echo "::notice::No Instagram credentials stored; skipping"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check API access (dry run only)
        if: inputs.dry_run && steps.creds.outputs.ready == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/publish.mjs check

      # Posts today's date if posts/schedule.json lists it, it is past noon Pacific and it has no
      # marker. PAGES_BASE_URL, the time zone and the hour come from brand.json.
      - name: Publish what is due
        if: steps.creds.outputs.ready == 'true' && inputs.by_hand != true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          POST_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/publish.mjs

      # A post put up by hand: write its marker here, on main, so no later run posts it. Calls nothing
      # on Instagram and needs no credentials.
      - name: Record a post made by hand
        if: inputs.by_hand == true
        env:
          POST_DATE: ${{ inputs.date }}
        run: |
          if [ -z "$POST_DATE" ]; then echo "::error::by_hand needs the date of the post"; exit 1; fi
          node scripts/publish.mjs mark --date "$POST_DATE" --note "recorded by hand from the workflow"

      # Media of posts that went out more than 30 days ago leaves the Pages site (captions and meta
      # stay); never a post without a marker
      - name: Prune old media
        if: always() && steps.creds.outputs.ready == 'true' && inputs.dry_run != true && inputs.by_hand != true
        run: node scripts/prune.mjs

      # Runs even when a post failed partway: a marker already written must be saved or the next run
      # would post that date again. The prune's deletions go in the same commit and push.
      - name: Record what was posted
        if: always() && (steps.creds.outputs.ready == 'true' || inputs.by_hand == true)
        env:
          BY_HAND: ${{ inputs.by_hand }}
        run: |
          git config user.name "winerybooks-social-bot"
          git config user.email "winerybooks-social-bot@users.noreply.github.com"
          git add published 2>/dev/null || true
          # Name the commit after each new marker: "Posted 2026-11-02"
          posted=$(git diff --cached --name-only --diff-filter=A -- published \
            | sed -n 's#^published/\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\)\.json$#\1#p' \
            | sort | paste -sd ',' - | sed 's/,/, /g')
          git add -A posts 2>/dev/null || true
          pruned=$(git diff --cached --name-only --diff-filter=D -- posts | wc -l | tr -d ' ')
          if git diff --cached --quiet; then echo "Nothing new to record"; exit 0; fi
          if [ -n "$posted" ]; then msg="Posted $posted"; else msg="Pruned media posted more than 30 days ago"; fi
          if [ -n "$posted" ] && [ "$BY_HAND" = "true" ]; then msg="$msg by hand"; fi
          if [ -n "$posted" ] && [ "$pruned" != "0" ]; then msg="$msg; pruned $pruned old media files"; fi
          git commit -q -m "$msg"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q && exit 0
            sleep $((i * 5))
          done
          echo "::error::Could not push the marker after 5 attempts"; exit 1

      # Long-lived tokens last 60 days. Refreshing is only usable with GH_PAT, a fine-grained personal
      # access token with "Secrets: write" on this repo, because the job must store the new token.
      # Without GH_PAT this step skips with a notice and does not call Instagram. On Mondays, on
      # whichever run gets there; a second refresh the same day is refused by Instagram (token under
      # 24 hours old) and only logged.
      # always(): a Monday whose post failed must still refresh, or the token's 60 days run out quietly
      - name: Refresh the Instagram token (Mondays)
        if: always() && steps.creds.outputs.ready == 'true' && inputs.dry_run != true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ "$(TZ=America/Los_Angeles date +%u)" != "1" ]; then
            echo "Not a Monday in Pacific time; skipping refresh"; exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::GH_PAT is not set, so the token refresh is skipped. The stored IG_ACCESS_TOKEN expires 60 days after it was generated: add GH_PAT or regenerate the token in the Meta dashboard before then (see README)."
            exit 0
          fi
          node scripts/publish.mjs refresh
          if [ -s new-token.txt ]; then
            gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < new-token.txt
            echo "Stored the refreshed token"
          fi
          rm -f new-token.txt
